name: Pi package audit

on:
  pull_request:
    paths:
      - 'runtime/pi/**'
      - '.github/workflows/pi-package-audit.yml'
      - 'docs/rust-first/s2-feasibility.md'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pi-package-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Evidence only. A green audit confirms the published-package NO-GO. It is
  # not pi-bridge-contract and does not unblock live work.
  pi-package-audit:
    name: pi-package-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: runtime/pi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: runtime/pi/.node-version
          cache: npm
          cache-dependency-path: runtime/pi/package-lock.json
      - name: Install audited packages
        run: npm ci
      - name: Verify diagnostic probes (not S2 acceptance)
        run: npm run verify
      - name: Record the NO-GO evidence
        run: |
          npm run --silent audit:package > "$RUNNER_TEMP/pi-package-audit.json"
          node --input-type=module - <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pi-package-audit.json`, 'utf8'));
          if (report.decision !== 'NO-GO' || !Array.isArray(report.blockers) || report.blockers.length === 0) {
            throw new Error('Expected observed incompatibilities; reassess the published-package audit before changing its NO-GO');
          }
          const version = report.packageAudit?.version;
          const published = typeof version === 'string' && version.length > 0
            ? `published ${version} package`
            : 'published package';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Published package: NO-GO\n\nThe audit reproduced package/API incompatibilities. This job is not pi-bridge-contract. The ${published} remains NO-GO. The source-built candidate is the accepted path (2026-11-02); see docs/rust-first/s2-contract-gate.md.\n`);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-package-audit
          path: ${{ runner.temp }}/pi-package-audit.json
          if-no-files-found: error
