name: AI review (advisory)

# Trial advisory review. Not a required check. execution-confinement stays the
# merge gate. pull_request only: pull_request_target would expose secrets to
# fork code, and this job must skip when the placeholder secret is absent.
#
# OpenCodeReview v1.13.9 (commit 0e9060da66af36a96a15516e76a001953095318b).
# The composite action posts inline review comments, so this job installs the
# CLI and posts one sticky summary instead. It does not use MCP, delegation,
# or agent-skill mode.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review-advisory:
    name: ai-review-advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      # Placeholders. The owner chooses the model and sets these; until then
      # the job skips. OCR_MODEL is exported as OCR_LLM_MODEL and passed to
      # --model. v1.13.9 needs a complete URL/token/model triple, so OCR_LLM_URL
      # is required too. When OCR_LLM_PROTOCOL is empty the CLI defaults the
      # protocol to anthropic; the gate waits for an explicit protocol instead
      # of sending a diff under that default. The API key stays on the steps
      # that read it (secret OCR_API_KEY, exported as OCR_LLM_TOKEN).
      OCR_MODEL: ${{ vars.OCR_MODEL }}
      OCR_LLM_URL: ${{ vars.OCR_LLM_URL }}
      OCR_LLM_PROTOCOL: ${{ vars.OCR_LLM_PROTOCOL }}
      # v1.13.9 treats 0 as unlimited. 80000 is the trial cap.
      OCR_MAX_TOKENS_BUDGET: "80000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Skip unless the owner has set the placeholder secret and variables
        id: gate
        env:
          # Placeholder secret. Empty includes fork PRs, where secrets are unavailable.
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${OCR_API_KEY}" ] || missing+=("secret OCR_API_KEY")
          [ -n "${OCR_MODEL}" ] || missing+=("variable OCR_MODEL")
          [ -n "${OCR_LLM_URL}" ] || missing+=("variable OCR_LLM_URL")
          [ -n "${OCR_LLM_PROTOCOL}" ] || missing+=("variable OCR_LLM_PROTOCOL")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            printf -v joined '%s, ' "${missing[@]}"
            joined="${joined%, }"
            echo "::notice title=Advisory OCR review skipped::${joined} unset. No diff was sent to a model. This check is advisory and does not block merge."
            exit 0
          fi
          if [[ ! "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::pull request base ref or head sha is not usable"
            exit 1
          fi
          {
            echo "configured=true"
            echo "base_ref=${BASE_REF}"
            echo "head_sha=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: success() && steps.gate.outputs.configured == 'true'
        with:
          node-version: "22"

      - name: Install OpenCodeReview 1.13.9
        if: success() && steps.gate.outputs.configured == 'true'
        env:
          # Keep the npm pin. The launcher must not replace it mid-run.
          OCR_NO_UPDATE: "1"
        run: |
          set -euo pipefail
          # @alibaba-group/open-code-review@1.13.9
          # alibaba/open-code-review@0e9060da66af36a96a15516e76a001953095318b # v1.13.9
          npm i -g @alibaba-group/open-code-review@1.13.9
          version_line="$(ocr version | head -n 1)"
          printf '%s\n' "$version_line"
          case "$version_line" in
            "open-code-review v1.13.9"*|"open-code-review 1.13.9"*) ;;
            *)
              echo "::error::expected open-code-review 1.13.9, got: ${version_line}"
              exit 1
              ;;
          esac

      - name: Review the pull request range
        id: review
        if: success() && steps.gate.outputs.configured == 'true'
        env:
          OCR_NO_UPDATE: "1"
          # Placeholder secret OCR_API_KEY, mapped to the v1.13.9 token variable.
          OCR_LLM_TOKEN: ${{ secrets.OCR_API_KEY }}
          OCR_LLM_MODEL: ${{ vars.OCR_MODEL }}
          BASE_REF: ${{ steps.gate.outputs.base_ref }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          OCR_RESULT_PATH: ${{ runner.temp }}/ocr-review.json
        run: |
          set -euo pipefail
          if [[ ! "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::base ref is not a single safe git ref"
            exit 1
          fi
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::head sha is not a full commit sha"
            exit 1
          fi
          if [[ ! "$OCR_MAX_TOKENS_BUDGET" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::OCR_MAX_TOKENS_BUDGET must be a positive base-10 integer"
            exit 1
          fi
          case "$OCR_LLM_PROTOCOL" in
            anthropic|openai|openai-responses) ;;
            *)
              echo "::error::OCR_LLM_PROTOCOL must be anthropic, openai, or openai-responses"
              exit 1
              ;;
          esac
          git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" >/dev/null
          git rev-parse --verify --quiet "${HEAD_SHA}^{commit}" >/dev/null
          export OCR_LLM_URL OCR_LLM_PROTOCOL OCR_LLM_TOKEN OCR_LLM_MODEL
          ocr review \
            --from "origin/${BASE_REF}" \
            --to "${HEAD_SHA}" \
            --format json \
            --audience agent \
            --effort low \
            --max-tokens-budget "${OCR_MAX_TOKENS_BUDGET}" \
            --model "${OCR_MODEL}" \
            --output "${OCR_RESULT_PATH}"

      - name: Upload the review JSON
        if: success() && steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocr-advisory-review
          path: ${{ runner.temp }}/ocr-review.json
          if-no-files-found: error
          retention-days: 14

      - name: Post or update the sticky summary comment
        if: always() && steps.gate.outputs.configured != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OCR_CONFIGURED: ${{ steps.gate.outputs.configured }}
          OCR_REVIEW_OUTCOME: ${{ steps.review.outcome }}
          OCR_RESULT_PATH: ${{ runner.temp }}/ocr-review.json
          OCR_MAX_TOKENS_BUDGET: "80000"
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- ocr-advisory-review -->";

            function oneLine(value, max) {
              const clean = String(value || "").replace(/\s+/g, " ").trim();
              if (clean.length <= max) return clean;
              return clean.slice(0, max - 1) + "...";
            }

            function summaryBody() {
              if (process.env.OCR_CONFIGURED !== "true") {
                return [
                  marker,
                  "## Advisory AI review (open-code-review)",
                  "",
                  "Skipped. Placeholder secret `OCR_API_KEY` or placeholder variables `OCR_MODEL`, `OCR_LLM_URL`, and `OCR_LLM_PROTOCOL` are unset, so this run did not call a model and did not send the diff anywhere. Fork pull requests do not receive Actions secrets.",
                  "",
                  "This check is advisory and is not a required status check. `execution-confinement` remains the merge gate.",
                ].join("\n");
              }
              if (process.env.OCR_REVIEW_OUTCOME !== "success" || !fs.existsSync(process.env.OCR_RESULT_PATH)) {
                return [
                  marker,
                  "## Advisory AI review (open-code-review)",
                  "",
                  "The advisory review did not finish (`" + (process.env.OCR_REVIEW_OUTCOME || "unknown") + "`). No inline comments were posted. This check does not block merge.",
                ].join("\n");
              }
              let report;
              try {
                report = JSON.parse(fs.readFileSync(process.env.OCR_RESULT_PATH, "utf8"));
              } catch (error) {
                return [
                  marker,
                  "## Advisory AI review (open-code-review)",
                  "",
                  "The review JSON could not be parsed (" + oneLine(error.message, 200) + "). The raw artifact is `ocr-advisory-review`. No inline comments were posted.",
                ].join("\n");
              }
              const summary = report && report.summary ? report.summary : {};
              const llm = report && report.llm ? report.llm : {};
              const comments = Array.isArray(report && report.comments) ? report.comments : [];
              const warnings = Array.isArray(report && report.warnings) ? report.warnings : [];
              const lines = [
                marker,
                "## Advisory AI review (open-code-review)",
                "",
                "Advisory only. This is not a required check, and no inline comments were posted. `execution-confinement` remains the merge gate.",
                "",
                "- Status: `" + oneLine(report.status || "unknown", 80) + "`",
                "- Model: `" + oneLine(llm.model || process.env.OCR_MODEL || "unreported", 120) + "`",
                "- Provider: `" + oneLine(llm.provider || "unreported", 80) + "`",
                "- Files reviewed: " + (summary.files_reviewed == null ? "unreported" : summary.files_reviewed),
                "- Findings: " + comments.length,
                "- Tokens: " + (summary.total_tokens == null ? "unreported" : summary.total_tokens) + " total (input " + (summary.input_tokens == null ? "?" : summary.input_tokens) + ", output " + (summary.output_tokens == null ? "?" : summary.output_tokens) + ")",
                "- Elapsed: " + oneLine(summary.elapsed || "unreported", 40),
                "- Token cap (`OCR_MAX_TOKENS_BUDGET`): " + process.env.OCR_MAX_TOKENS_BUDGET,
                "- Warnings: " + warnings.length,
              ];
              if (report.message) lines.push("", oneLine(report.message, 500));
              if (comments.length === 0) {
                lines.push("", "No findings.");
              } else {
                lines.push("", "### Findings");
                const shown = comments.slice(0, 12);
                for (const comment of shown) {
                  const path = oneLine(comment.path || "unknown", 200);
                  const start = comment.start_line == null ? "?" : comment.start_line;
                  const end = comment.end_line == null ? "?" : comment.end_line;
                  lines.push("- `" + path + ":" + start + "-" + end + "` — " + oneLine(comment.content, 220));
                }
                if (comments.length > shown.length) {
                  lines.push("- " + (comments.length - shown.length) + " more finding(s) are in the `ocr-advisory-review` artifact.");
                }
              }
              lines.push("", "The diff was sent to the configured model provider. Full JSON is in the `ocr-advisory-review` artifact.");
              return lines.join("\n").slice(0, 65000);
            }

            const body = summaryBody();
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find((comment) => typeof comment.body === "string" && comment.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            } catch (error) {
              const detail = error && (error.status || error.message) ? (error.status || error.message) : "unknown error";
              core.notice("Advisory review summary comment was not posted (" + detail + "). The check stays non-blocking.");
            }
