name: Pi bridge contract

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-bridge-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs: no path filter, optional feature leg, or continue-on-error.
  # The artifact records test evidence; S2 GO remains a reviewed decision.
  pi-bridge-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: runtime/pi-source/.node-version
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # resolved 2026-10-30
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Verify and install pinned npm
        run: node runtime/pi-source/install-npm.mjs
      - name: Rebuild integrity-locked source and install without lifecycle scripts
        working-directory: runtime/pi-source
        run: |
          node build.mjs
          npm ci
      - name: Run mandatory credential-free contract
        run: node runtime/pi-source/contract.mjs
      - name: Retain contract logs and exact revision evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-bridge-contract-evidence
          path: runtime/pi-source/.contract-results/
          include-hidden-files: true
          if-no-files-found: error
