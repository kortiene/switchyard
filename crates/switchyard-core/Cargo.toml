[package]
name = "switchyard-core"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Switchyard mission authority: transitions, ledger, and fake runtime (S1)."

[features]
pi-contract = []
linux-execution = ["dep:rustix"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", optional = true, default-features = false, features = ["std", "fs", "process"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
