[package]
name = "switchyard"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Switchyard Rust host CLI (S1 fake runtime)."

[[bin]]
name = "switchyard"
path = "src/main.rs"

[features]
linux-execution = ["switchyard-core/linux-execution"]
pi-contract = ["switchyard-core/pi-contract"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
switchyard-core = { path = "../switchyard-core" }

[[bin]]
name = "switchyard-execution-helper"
path = "src/bin/switchyard-execution-helper.rs"

[[test]]
name = "linux_execution"
path = "tests/linux_execution.rs"
required-features = ["linux-execution"]

[[test]]
name = "cli_confined"
path = "tests/cli_confined.rs"
required-features = ["pi-contract", "linux-execution"]

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }

[[bin]]
name = "switchyard-bridge-launcher"
path = "src/bin/switchyard-bridge-launcher.rs"
required-features = ["pi-contract", "linux-execution"]
