[package]
name = "switchyard-confinement-probe"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Test-only S3-A3 Linux confinement probe; not an ExecutionEnv backend."

[features]
linux-confinement = []
bridge-confinement = ["linux-confinement", "dep:switchyard-core"]
pi-linux-write = ["bridge-confinement", "switchyard-core/linux-execution"]
pi-linux-process = ["pi-linux-write"]

[dependencies]
serde_json = "1"
switchyard-core = { path = "../../crates/switchyard-core", features = ["pi-contract"], optional = true }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }

[[bin]]
name = "confinement-fixture"
path = "src/main.rs"
required-features = ["linux-confinement"]

[[test]]
name = "bridge_confinement"
path = "tests/bridge_confinement.rs"
required-features = ["bridge-confinement"]

[[test]]
name = "pi_linux_write"
path = "tests/pi_linux_write.rs"
required-features = ["pi-linux-write"]

[[test]]
name = "confinement"
path = "tests/confinement.rs"
required-features = ["linux-confinement"]

[[test]]
name = "pi_linux_process"
path = "tests/pi_linux_process.rs"
required-features = ["pi-linux-process"]

[[test]]
name = "bridge_lifecycle"
path = "tests/bridge_lifecycle.rs"
required-features = ["pi-linux-process"]

[[test]]
name = "pi_host_dispatch"
path = "tests/pi_host_dispatch.rs"
required-features = ["pi-linux-process"]
